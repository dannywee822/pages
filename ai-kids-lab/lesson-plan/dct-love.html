<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCT 형들 사랑해</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937, #0b1020 60%);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: #fff;
        overflow-x: hidden;
      }

      .bg-orbs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(30px);
        opacity: 0.45;
        animation: float 8s ease-in-out infinite;
      }

      .orb.one {
        width: 220px;
        height: 220px;
        left: 8%;
        top: 10%;
        background: #60a5fa;
      }

      .orb.two {
        width: 260px;
        height: 260px;
        right: 6%;
        top: 55%;
        background: #a78bfa;
        animation-delay: 1.4s;
      }

      .orb.three {
        width: 180px;
        height: 180px;
        left: 50%;
        top: 75%;
        background: #34d399;
        animation-delay: 2.1s;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(94vw, 920px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 22px;
        padding: 26px;
        backdrop-filter: blur(10px);
        box-shadow: 0 14px 45px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 6.5vw, 3.2rem);
        line-height: 1.15;
        color: #f9fafb;
        text-align: center;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 20px;
        text-align: center;
        color: #d1d5db;
        font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      }

      .video-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .cta-wrap {
        margin-top: 16px;
        display: flex;
        justify-content: center;
      }

      .cta-btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font-size: 0.98rem;
        font-weight: 700;
        color: #0b1020;
        background: linear-gradient(135deg, #93c5fd, #a7f3d0);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
      }

      .cta-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(56, 189, 248, 0.45);
      }

      .cta-btn:active {
        transform: translateY(0);
      }

      .message {
        margin-top: 10px;
        min-height: 24px;
        text-align: center;
        color: #bfdbfe;
        font-weight: 600;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(-16px) translateX(10px);
        }
      }

      @media (max-width: 640px) {
        .card {
          padding: 18px;
          border-radius: 16px;
        }

        .orb.one,
        .orb.two,
        .orb.three {
          filter: blur(24px);
          opacity: 0.35;
        }

        .cta-btn {
          width: 100%;
          max-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-orbs" aria-hidden="true">
      <div class="orb one"></div>
      <div class="orb two"></div>
      <div class="orb three"></div>
    </div>

    <main class="card">
      <h1>💙 dct형들 사랑해 💙</h1>
      <p>일스킬즈 - 알아들어 바로 재생</p>
      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/XfzyMSGN4-w"
          title="일스킬즈 - 알아들어"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <div class="cta-wrap">
        <button class="cta-btn" id="cheerBtn">형들 화이팅! 🙌</button>
      </div>
      <div class="message" id="msg"></div>
    </main>

    <script>
      const cheerBtn = document.getElementById("cheerBtn");
      const msg = document.getElementById("msg");

      cheerBtn.addEventListener("click", () => {
        msg.textContent = "DCT 형들 오늘도 리스펙트! 🔥";
      });
    </script>
  </body>
</html>

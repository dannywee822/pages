<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재병님 축하 페이지</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: radial-gradient(circle at top, #1e293b, #0b1020 60%);
        color: #f8fafc;
      }
      .card {
        width: min(92vw, 820px);
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 50px rgba(0,0,0,.35);
        backdrop-filter: blur(8px);
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        line-height: 1.15;
      }
      .sub {
        margin: 0 0 22px;
        color: #cbd5e1;
        font-weight: 700;
      }
      .msg {
        margin: 0 auto;
        max-width: 680px;
        background: rgba(15, 23, 42, .45);
        border: 1px solid rgba(148, 163, 184, .35);
        border-radius: 16px;
        padding: 18px;
        line-height: 1.75;
        font-size: clamp(1rem, 2.8vw, 1.1rem);
      }
      .em {
        color: #93c5fd;
        font-weight: 800;
      }
      .badge {
        display: inline-block;
        margin-top: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: linear-gradient(135deg,#93c5fd,#a7f3d0);
        color: #0b1020;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🎉 재병님, 진심으로 축하드립니다! 🎉</h1>
      <p class="sub">김앤장 새로운 출발, 정말 멋집니다.</p>
      <p class="msg">
        팀 동료로서 늘 보여주신 성실함과 실력 덕분에
        모두가 많이 배우고 의지할 수 있었습니다.<br />
        <span class="em">김앤장에서도 재병님만의 강점이 크게 빛날 거라 믿습니다.</span><br />
        앞으로의 길에 좋은 기회와 멋진 성과가 가득하시길 바랍니다.
      </p>
      <div class="badge">응원합니다 🙌</div>
    </main>
  </body>
</html>
